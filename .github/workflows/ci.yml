name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    # A GITHUB_TOKEN alapbol csak olvasni tud; a GHCR-be valo push-hoz kell
    # a packages: write. Csak ennyit adunk neki, semmi tobbet.
    permissions:
      contents: read
      packages: write

    # A tesztek nem hivjak a Riot API-t, es a DB/Redis kapcsolatot a Testcontainers
    # adja - de az application.yml placeholderei default nelkuliek, tehat a
    # kontextus fel sem epulne ertek nelkul. Ezert dummy ertekek, NEM titkok.
    env:
      RIOT_KEY: ci-dummy
      POSTGRES_PASSWORD: ci-dummy
      REDIS_PASSWORD: ci-dummy

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode verify

      # A jar innentol keszen all a target/-ben, tehat az image-nek mar
      # nem kell forditania - csak bemasolja.

      - name: Set up QEMU
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Mindket architektura elkeszul, igy a VPS valasztasa (ARM vagy x86)
          # nem kotodik ehhez a dontesehez.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/feedless-backend:latest
            ghcr.io/${{ github.repository_owner }}/feedless-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
