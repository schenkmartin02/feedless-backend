  - period:
      year: 2026
      month: 7
    title:
      hu: "A projekt indul"
      en: "The project starts"
    description:
      hu: "Első Riot API hívás, rate limiter és az adatbázis sémája."
      en: "First Riot API call, rate limiter and the database schema."
    version: "v0.1"

  - period:
      year: 2026
      month: 7
    title:
      hu: "Crawler és statisztikák"
      en: "Crawler and statistics"
    description:
      hu: "Saját meccsgyűjtés, és az első aggregált számok belőle."
      en: "Our own match collection, and the first aggregated numbers from it."
    version: "v0.2"

  - period:
      year: 2026
      month: 8
    title:
      hu: "Champion statisztikák élnek"
      en: "Champion statistics go live"
    description:
      hu: "Nyerési arány, tier és napi trend patchenként."
      en: "Win rate, tier and daily trend, per patch."
    version: "v0.3"

  - period:
      year: 2026
      month: 8
    title:
      hu: "Profilok és meccstörténet"
      en: "Profiles and match history"
    description:
      hu: "Bármelyik játékos kikereshető, a profilja igény szerint frissül."
      en: "Any player can be looked up, and their profile refreshes on demand."
    version: "v0.5"

  - period:
      year: 2026
      month: 8
    title:
      hu: "Élesbe állás"
      en: "Into production"
    description:
      hu: "Az api.feedless.gg saját szerveren fut, automatikus telepítéssel — egyelőre zárt körben."
      en: "api.feedless.gg runs on its own server with automated deploys — closed beta for now."
    version: "v0.6"

  - period:
      year: 2026
      month: 8
    title:
      hu: "Meccs részletek és teljesítmény"
      en: "Match details and performance"
    description:
      hu: "Részletes meccsoldal idővonallal, és nagyságrendekkel gyorsabb lekérdezések."
      en: "A detailed match page with a timeline, and queries that are orders of magnitude faster."
    version: "v0.9"

