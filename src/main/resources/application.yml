spring:
  application:
    name: feedless-backend

  task:
    scheduling:
      pool:
        size: 5

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/feedless
    username: feedless
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD}

management:
  endpoint:
    health:
      show-details: always

riot:
  api-key: ${RIOT_KEY}
  rate-limit:
    per-10-seconds: 500
    per-10-minutes: 30000

crawler:
  profile-refresh-ttl-days: 5
  recrawl:
    interval-ms: 60000
    ttl-days: 2
    batch-size: 8

stats:
  aggregation:
    interval-ms: 21600000        # 6 óra
    delay:
      champion-ms:  300000       #  5 perc
      rune-ms:      900000       # 15 perc
      item-ms:     1500000       # 25 perc
      matchup-ms:  2100000       # 35 perc
      ban-ms:      2700000       # 45 perc
      champion-snapshot-ms: 600000
      ban-snapshot-ms: 3000000
