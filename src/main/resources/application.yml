spring:
  application:
    name: feedless-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/feedless
    username: feedless
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD}

management:
  endpoint:
    health:
      show-details: always

riot:
  api-key: ${RIOT_KEY}
  rate-limit:
    per-10-seconds: 500
    per-10-minutes: 30000

crawler:
  profile-refresh-ttl-days: 5
  recrawl:
    interval-ms: 60000
    ttl-days: 2
    batch-size: 16