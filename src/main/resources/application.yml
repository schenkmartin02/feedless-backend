spring:
  application:
    name: feedless-backend

  task:
    scheduling:
      pool:
        size: 8

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/feedless
    username: feedless
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD}

management:
  endpoint:
    health:
      show-details: always

riot:
  api-key: ${RIOT_KEY}
  rate-limit:
    per-10-seconds: 500
    per-10-minutes: 30000

crawler:
  max-retries: 5
  refresh:
    cooldown-minutes: 5
  profile-refresh-ttl-days: 5
  recrawl:
    interval-ms: 60000
    ttl-days: 2
    batch-size: 200

retention:
  match-days: 30
  batch-size: 10000
  interval-ms: 600000     # 10 perc

stats:
  aggregation:
    interval-ms: 21600000        # 6 óra
    batch:
      size: 50000
      interval-ms: 300000
    delay:
      rune-ms:      900000       # 15 perc
      ban-ms:      1500000       # 45 perc
      champion-snapshot-ms: 600000
      ban-snapshot-ms: 1800000

cors:
  allowed-origins: https://feedless.gg
