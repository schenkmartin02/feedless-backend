# Eles compose - 2 vCPU / 4 GB RAM / 80 GB SSD.
#
# A memoria-felosztas szandekos, es osszefugg egymassal:
#   postgres 1.6 GB + backend 1.4 GB + redis 0.19 GB + caddy 0.09 GB = ~3.28 GB
#   marad ~800 MB az operacios rendszernek es a lemez-gyorsitotarnak (page cache),
#   amibol a Postgres olvas. Ha barmelyik limitet emeled, valahonnan el kell venni.
#
# Ez SZOROS, de a nehez munka (aggregacio) batch job: lassabb lehet, csak
# fejezodjon be 6 oran belul. Ha nagyobb gepre valtasz, ezek az ertekek
# aranyosan emelendok - a felezo szabaly: shared_buffers ~ RAM/4,
# JVM limit ~ RAM/3, effective_cache_size ~ shared_buffers + szabad RAM.
#
# Hasznalat a VPS-en (/opt/feedless):
#   docker compose pull && docker compose up -d

services:

  postgres:
    image: postgres:16          # FIX major verzio: a V29 f_unaccent-je PG 18-on elhasal
    restart: unless-stopped
    environment:
      POSTGRES_USER: feedless
      POSTGRES_DB: feedless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD hianyzik a .env-bol}
    command:
      - postgres
      - -c
      - shared_buffers=1GB              # amit a Postgres SAJAT MAGA cache-el
      - -c
      - effective_cache_size=1800MB     # becsles: shared_buffers + varhato page cache
      - -c
      - work_mem=16MB                   # MUVELETENKENT es kapcsolatonkent!
      - -c
      - maintenance_work_mem=256MB      # index-epites, VACUUM
      - -c
      - max_connections=30
      - -c
      - random_page_cost=1.1            # SSD: az random olvasas alig dragabb a szekvencialisnal
      - -c
      - max_wal_size=2GB                # ritkabb checkpoint a folyamatos ingest alatt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedless -d feedless"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1600m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD hianyzik a .env-bol}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru               # cache-kent viselkedjen: teleskor a legregebbi kulcsot dobja
      - --save
      - ""                        # nincs lemezre mentes: ez cache, nem adattar
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/schenkmartin02/feedless-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # A szolgaltatasnevek egyben DNS-nevek is a compose halozatan.
      DB_HOST: postgres
      REDIS_HOST: redis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RIOT_KEY: ${RIOT_KEY:?RIOT_KEY hianyzik a .env-bol}
      # Elesben ne teregesse ki a DB es a Redis allapotat barkinek.
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
    healthcheck:
      # A temurin image-ben nincs curl es wget, ezert a bash sajat /dev/tcp-jevel
      # nezzuk meg, hogy a port nyitva van-e. Ez nem "egeszseges-e az app",
      # csak annyi, hogy "elindult-e" - a valodi health-et a Cloudflare/uptime
      # monitor fogja kivulrol nezni az /actuator/health-en.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # A portot NEM publikaljuk: a backendhez csak a caddy fer hozza a belso halozaton.
    mem_limit: 1400m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 96m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
