# Eles compose - 4 vCPU / 8 GB RAM / 80 GB SSD.
#
# A memoria-felosztas szandekos, es osszefugg egymassal:
#   postgres 3 GB + backend 2 GB + redis 0.38 GB + caddy 0.13 GB = ~5.5 GB
#   marad ~2.5 GB az operacios rendszernek es a lemez-gyorsitotarnak (page cache),
#   amibol a Postgres olvas. Ha barmelyik limitet emeled, valahonnan el kell venni.
#
# A felezo szabaly, amivel ezek az ertekek szamolva vannak:
#   shared_buffers ~ RAM/4, JVM limit ~ RAM/3, effective_cache_size ~ shared_buffers + szabad RAM.
#
# A backend limitje SZANDEKOSAN alacsonyabb a RAM/3-nal (2 GB a 2.7 helyett):
# a JVM ugyis csak a limit 75%-at veszi heapnek (MaxRAMPercentage a Dockerfile-ban),
# es minden GB, amit nem adunk neki, page cache marad a Postgresnek - ami ennel a
# terhelesnel (nagy tablak vegigolvasasa) tobbet er, mint a nagyobb heap.
#
# Hasznalat a VPS-en (/opt/feedless):
#   docker compose pull && docker compose up -d

services:

  postgres:
    image: postgres:16          # FIX major verzio: a V29 f_unaccent-je PG 18-on elhasal
    # A Docker alapertelmezett 64 MB-os /dev/shm-je keves a parhuzamos lekerdezesek
    # kozos hash tablainak: "could not resize shared memory segment ... No space left
    # on device". Ez NEM a konteneren beluli memoriakorlat, hanem kulon tmpfs meret.
    restart: unless-stopped
    environment:
      POSTGRES_USER: feedless
      POSTGRES_DB: feedless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD hianyzik a .env-bol}
    command:
      - postgres
      - -c
      - shared_buffers=2GB              # amit a Postgres SAJAT MAGA cache-el
      - -c
      - effective_cache_size=4500MB     # becsles: shared_buffers + varhato page cache
      - -c
      - work_mem=32MB                   # MUVELETENKENT es kapcsolatonkent!
      - -c
      - maintenance_work_mem=512MB      # index-epites, VACUUM
      - -c
      - max_connections=30
      - -c
      - random_page_cost=1.1            # SSD: az random olvasas alig dragabb a szekvencialisnal
      - -c
      - max_wal_size=4GB                # ritkabb checkpoint a folyamatos ingest alatt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedless -d feedless"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    shm_size: 512m
    mem_limit: 3072m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD hianyzik a .env-bol}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru               # cache-kent viselkedjen: teleskor a legregebbi kulcsot dobja
      - --save
      - ""                        # nincs lemezre mentes: ez cache, nem adattar
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/schenkmartin02/feedless-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # A szolgaltatasnevek egyben DNS-nevek is a compose halozatan.
      DB_HOST: postgres
      REDIS_HOST: redis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RIOT_KEY: ${RIOT_KEY:?RIOT_KEY hianyzik a .env-bol}
      # Elesben ne teregesse ki a DB es a Redis allapotat barkinek.
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
      # Diszkfigyeles kulon monitor nelkul: az actuator beepitett diskSpace
      # indikatora DOWN-ra viszi a health-et, ha a szabad hely 8 GB ala esik.
      # Igy az uptime monitor, ami amugy is a /actuator/health-et nezi,
      # a betelo lemezre is riaszt - nem kell hozza sem cron, sem levelkuldes.
      MANAGEMENT_HEALTH_DISKSPACE_THRESHOLD: 8GB
    healthcheck:
      # A temurin image-ben nincs curl es wget, ezert a bash sajat /dev/tcp-jevel
      # nezzuk meg, hogy a port nyitva van-e. Ez nem "egeszseges-e az app",
      # csak annyi, hogy "elindult-e" - a valodi health-et a Cloudflare/uptime
      # monitor fogja kivulrol nezni az /actuator/health-en.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # A portot NEM publikaljuk: a backendhez csak a caddy fer hozza a belso halozaton.
    mem_limit: 2048m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
